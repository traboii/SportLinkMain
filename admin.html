<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#260000" />
    <title>SportLink | Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <main class="page-shell admin-shell">
      <section class="login-card admin-login" id="admin-login-card" aria-labelledby="admin-title">
        <div class="brand-mark"><img src="assets/orange-ccs-sportshub.png" alt="SportLink" /></div>
        <h1 id="admin-title">Admin login</h1>
        <p class="admin-caption">SportLink management</p>
        <form class="login-form" id="admin-login-form">
          <label class="sr-only" for="admin-email">Admin email</label>
          <input id="admin-email" type="email" autocomplete="username" placeholder="Admin email" required />
          <label class="sr-only" for="admin-password">Password</label>
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="Password" required />
          <button class="primary-button" id="admin-submit" type="submit">Log in</button>
          <p class="form-message" id="admin-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" hidden aria-labelledby="dashboard-title">
        <header class="admin-header">
          <div class="admin-brand"><img src="assets/orange-ccs-sportshub.png" alt="" /><div><strong>SportLink</strong><span>Admin dashboard</span></div><span class="admin-role-badge">ADMIN ACCOUNT</span></div>
          <button class="admin-logout" id="admin-logout" type="button">Log out</button>
        </header>
        <div class="admin-content">
          <p class="admin-eyebrow">ADMINISTRATION</p>
          <h1 id="dashboard-title">Welcome, admin</h1>
          <p class="admin-subtitle" id="admin-welcome"></p>
          <article class="admin-stat"><span>CLIENT ACCOUNTS</span><strong id="client-count">—</strong></article>
          <section class="admin-users-section">
            <div class="admin-list-heading"><h2>Registered users</h2><button id="refresh-users" type="button">Refresh</button></div>
            <div class="admin-user-list" id="admin-user-list"><p class="empty-users">Loading accounts…</p></div>
          </section>
          <section class="admin-news-editor" aria-labelledby="news-editor-title">
            <div class="admin-list-heading"><div><h2 id="news-editor-title">News and article content</h2><p>Edit the cards and article pages clients see.</p></div><button id="add-news-story" type="button">Add story</button></div>
            <label class="editor-label" for="news-story-select">Story</label>
            <select id="news-story-select"></select>
            <form id="news-story-form">
              <div class="news-editor-grid">
                <label>Card title<input name="title" required maxlength="180" /></label>
                <label>Card category<input name="tag" maxlength="60" /></label>
                <label class="editor-wide">Card summary<textarea name="text" rows="3"></textarea></label>
                <label class="editor-wide">Card image<input name="image" /><small>Upload an image or enter an assets/ path.</small><input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp" /></label>
                <label class="editor-wide">Article title<input name="articleTitle" required maxlength="180" /></label>
                <label>Publish date<input name="date" placeholder="October 30, 2026" /></label>
                <label>Author<input name="author" /></label>
                <label class="editor-wide">Article paragraph 1<textarea name="paragraph" rows="4"></textarea></label>
                <label class="editor-wide">Article paragraph 2<textarea name="paragraph2" rows="4"></textarea></label>
                <label class="editor-wide">Article hero image<input name="heroImage" /><small>Upload an image or enter an assets/ path.</small><input name="heroFile" type="file" accept="image/png,image/jpeg,image/webp" /></label>
                <div class="editor-wide"><span class="editor-label">Attached photos (up to 5)</span><div class="gallery-editor" id="gallery-editor"></div></div>
              </div>
              <div class="editor-actions"><button class="admin-save-news" type="submit">Save story</button><button id="delete-news-story" type="button">Delete story</button><p id="news-save-message" role="status" aria-live="polite"></p></div>
            </form>
          </section>
        </div>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>

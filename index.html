<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#260000" />
    <title>SportLink | Welcome</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-labelledby="welcome-title">
      <div class="mobile-athletes" aria-hidden="true"></div>
      <section class="login-card" id="auth-card" aria-label="SportLink login">
        <div class="brand-mark"><img src="assets/orange-ccs-sportshub.png" alt="SportLink" /></div>
        <h1 id="welcome-title">Welcome!</h1>
        <div class="profile-mark" aria-hidden="true"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="31" fill="none" stroke="white" stroke-width="3" /><circle cx="36" cy="25" r="11" fill="white" /><path d="M16 59c3-13 11-20 20-20s17 7 20 20" fill="white" /></svg></div>
        <form class="login-form" id="login-form">
          <p class="auth-heading" id="auth-heading">Log in to your account</p>
          <label class="sr-only" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="Email" required />
          <label class="sr-only" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" minlength="8" required />
          <button class="primary-button" id="submit-button" type="submit">Login</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
        <button class="text-button" id="mode-button" type="button">Create an account</button>
        <div class="divider"><span>or</span></div>
        <div id="google-signin" class="google-signin"></div>
        <p class="google-note" id="google-note">Google sign-in needs an OAuth web client ID.</p>
      </section>
      <section class="login-card success-card" id="success-card" hidden aria-live="polite">
        <div class="brand-mark"><img src="assets/orange-ccs-sportshub.png" alt="SportLink" /></div>
        <h1>You're signed in</h1>
        <span class="signed-in-role" id="signed-in-role" hidden>ADMIN ACCOUNT</span>
        <p class="signed-in-email" id="signed-in-email"></p>
        <button class="primary-button logout-button" id="logout-button" type="button">Log out</button>
      </section>
    </main>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
  </body>
</html>
